defaultBaseImage: ghcr.io/ninedraft/mydots/backscratcher:latest
defaultPlatforms:
  - linux/amd64
  - linux/arm64
  - linux/arm/v7
  - linux/arm/v6
  - linux/ppc64le
  - linux/s390x
  - linux/riscv64
defaultEnv:
  CGO_ENABLED: "0"
builds:
  - id: server
    main: ./cmd/server
    binary: tgbotstream
    bare: true
    flags:
      - -tags=timetzdata,certs
