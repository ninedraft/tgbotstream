name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

jobs:
  test:
    name: Vet and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Download modules
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go test
        run: go test ./...

  publish:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      KO_DATA_PATH: /tmp/ko-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Download modules
        run: go mod download

      - name: Set up ko
        uses: ko-build/setup-ko@v0.9
        with:
          version: latest-release

      - name: Select image tags
        id: ko-tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ref="${GITHUB_REF#refs/tags/}"
            echo "tags=${ref},latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "tags=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish image with ko
        env:
          KO_TAGS: ${{ steps.ko-tags.outputs.tags }}
        run: |
          if [[ -n "${KO_TAGS}" ]]; then
            ko publish ./cmd/server --tags "${KO_TAGS}"
          else
            ko publish ./cmd/server
          fi
